name: Build

# Tests and packages every push. Releases are built, notarized and published locally with
# Scripts/release.sh.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same ref makes an older run pointless.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Tool versions
        run: |
          xcodebuild -version
          sw_vers

      # Since Xcode 26 the Metal toolchain is a separate download that the runner image may lack.
      - name: Metal toolchain
        run: |
          if ! xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun -sdk macosx metal --version

      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: brew install xcodegen

      - name: Unit tests
        run: |
          xcodegen generate --quiet
          xcodebuild -project MacDuo.xcodeproj -scheme MacDuo -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build/DerivedData test

      - name: Package
        run: |
          Scripts/package.sh
          {
            echo '### Mac Duo build'
            echo
            echo '```'
            cat build/MacDuo-*.zip.sha256
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Hosted runners may have no GPU; the result is informational and shown in the log.
      - name: Rendering self-test
        continue-on-error: true
        run: |
          system_profiler SPDisplaysDataType | head -20
          build/DerivedData/Build/Products/Release/MacDuo.app/Contents/MacOS/MacDuo --self-test

      - name: Launch smoke test
        run: |
          app=build/DerivedData/Build/Products/Release/MacDuo.app
          "$app/Contents/MacOS/MacDuo" > build/smoke.log 2>&1 &
          pid=$!
          sleep 8
          if kill -0 "$pid" 2>/dev/null; then
            echo "Still running after 8 s"
            kill "$pid"
          else
            wait "$pid" || true
            echo "The app exited early:" >&2
            cat build/smoke.log
            exit 1
          fi
          cat build/smoke.log

      - uses: actions/upload-artifact@v4
        with:
          name: MacDuo
          path: |
            build/MacDuo-*.zip
            build/MacDuo-*.zip.sha256
          if-no-files-found: error
          retention-days: 14
